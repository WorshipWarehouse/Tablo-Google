name: Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tablo-multiview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-sideload-apk:
    # Only the protected main branch publishes the downloadable APK. Pull
    # requests still build and test, but never receive signing credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 repository secret." >&2
            exit 1
          }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tablo-release.jks"

      - name: Assemble signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/tablo-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "One or more Android signing secrets are missing." >&2
            exit 1
          }
          ./gradlew --no-daemon assembleRelease

      - name: Publish latest APK to outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk outputs/tablo-multiview-debug.apk
          git add outputs/tablo-multiview-debug.apk
          if git diff --cached --quiet; then
            echo "APK is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish latest sideload APK"
          git push
